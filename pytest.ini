[pytest]
# Unit tests live in tests/ only.
#
# scripts/ contains *manual* verification demos (e.g. scripts/test_speech.py)
# that are run directly with `python scripts/...`. Collecting them too caused a
# module-basename collision with tests/test_speech.py, so the test paths are
# restricted here rather than relying on import order.
testpaths = tests
python_files = test_*.py
addopts = -ra
